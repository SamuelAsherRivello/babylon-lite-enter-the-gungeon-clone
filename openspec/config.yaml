schema: spec-driven
context: |
  Repository: babylon-lite-enter-the-gungeon-clone.
  Original landscape 1–4-player cooperative wave arena.
  Babylon Lite/WebGPU renderer, plain JavaScript/Vite client, authoritative
  Colyseus server and shared client pinned to release 0.7.0.
  Browser never owns health, movement outcomes or combat; no credentials.
  GitHub Pages static frontend; Vercel in-memory backend with session limits.
  Verification: npm test, npm run build, npm run test:browser, public two-client play.
  Canonical project documentation assets live in project-name/documentation/.
rules:
  proposal:
    - Mark unresolved decisions clearly; recommendations are not approvals.
    - State the affected user behavior and acceptance criteria.
  design:
    - Describe only architecture and technologies verified for this project.
    - Preserve explicit boundaries between application layers or packages.
  tasks:
    - Keep planning, implementation, and verification tasks explicit.
    - Include focused checks appropriate to the implemented change.

